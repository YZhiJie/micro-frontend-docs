    <text x="28" y="94" font-size="12" class="ink">轻量、框架无关；</text>
    <text x="28" y="114" font-size="12" class="ink">路由与沙箱要自己补。</text>
    <text x="28" y="140" font-size="12" font-weight="600" fill="#2563EB">→ 看 Web Components 实战</text>
