<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-label="第二话：Web Components 组件级复用">
  <rect width="1200" height="370" fill="#F8FAFC"/>
  <style>
