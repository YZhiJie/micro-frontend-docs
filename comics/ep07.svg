<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-label="第七话：Module Federation 构建时共享">
  <rect width="1200" height="370" fill="#F8FAFC"/>
  <style>
    text { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .mentor { fill: #2563EB; }
    .student { fill: #F59E0B; }
    .ink { fill: #1E293B; }
    .bubble { fill: #FFFFFF; stroke-width: 2.5; }
  </style>
  <defs>
    <g id="m">
      <rect x="62" y="262" width="56" height="56" rx="16" fill="#2563EB" stroke="#1E293B" stroke-width="3"/>
      <circle cx="90" cy="233" r="26" fill="#FDE68A" stroke="#1E293B" stroke-width="3"/>
      <path d="M64 233 Q64 204 90 204 Q116 204 116 233 Q106 221 90 221 Q74 221 64 233 Z" fill="#1E293B"/>
      <circle cx="80" cy="238" r="6" fill="none" stroke="#1E293B" stroke-width="2"/>
      <circle cx="100" cy="238" r="6" fill="none" stroke="#1E293B" stroke-width="2"/>
      <line x1="86" y1="238" x2="94" y2="238" stroke="#1E293B" stroke-width="2"/>
      <path d="M84 249 Q90 254 96 249" fill="none" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g id="s">
      <rect x="176" y="272" width="48" height="48" rx="14" fill="#F59E0B" stroke="#1E293B" stroke-width="3"/>
      <circle cx="200" cy="247" r="22" fill="#FDE68A" stroke="#1E293B" stroke-width="3"/>
      <path d="M178 247 Q178 225 200 225 Q222 225 222 247 Q212 237 200 237 Q188 237 178 247 Z" fill="#1E293B"/>
      <circle cx="192" cy="248" r="2.5" fill="#1E293B"/>
      <circle cx="208" cy="248" r="2.5" fill="#1E293B"/>
      <path d="M193 257 Q200 262 207 257" fill="none" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>
    </g>
  </defs>

  <g transform="translate(20,20)">
    <rect width="280" height="330" rx="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="3"/>
    <text x="16" y="28" font-size="11" fill="#94A3B8">EP07 · 1</text>
    <text x="264" y="28" font-size="11" fill="#94A3B8" text-anchor="end">构建时共享</text>
    <rect class="bubble" x="14" y="46" width="252" height="110" rx="14" stroke="#F59E0B"/>
    <text x="28" y="70" font-size="13" font-weight="600" class="student">小前</text>
    <text x="28" y="94" font-size="12" class="ink">不想运行时加载整套应用，</text>
    <text x="28" y="114" font-size="12" class="ink">只想共享模块。</text>
    <use href="#m"/><use href="#s"/>
  </g>

  <g transform="translate(310,20)">
    <rect width="280" height="330" rx="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="3"/>
    <text x="16" y="28" font-size="11" fill="#94A3B8">EP07 · 2</text>
    <rect class="bubble" x="14" y="46" width="252" height="110" rx="14" stroke="#2563EB"/>
    <text x="28" y="70" font-size="13" font-weight="600" class="mentor">阿微</text>
    <text x="28" y="94" font-size="12" class="ink">Module Federation：</text>
    <text x="28" y="114" font-size="12" class="ink">远程暴露，宿主直接 import。</text>
    <use href="#m"/><use href="#s"/>
  </g>

  <g transform="translate(600,20)">
    <rect width="280" height="330" rx="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="3"/>
    <text x="16" y="28" font-size="11" fill="#94A3B8">EP07 · 3</text>
    <rect class="bubble" x="14" y="46" width="252" height="110" rx="14" stroke="#2563EB"/>
    <text x="28" y="70" font-size="13" font-weight="600" class="mentor">阿微</text>
    <text x="28" y="94" font-size="12" class="ink">关键是 shared 单例，</text>
    <text x="28" y="114" font-size="12" class="ink">Vue 只能有一份。</text>
    <text x="28" y="136" font-size="12" class="ink">否则响应式不互通。</text>
    <use href="#m"/><use href="#s"/>
  </g>

  <g transform="translate(890,20)">
    <rect width="280" height="330" rx="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="3"/>
    <text x="16" y="28" font-size="11" fill="#94A3B8">EP07 · 4</text>
    <rect class="bubble" x="14" y="46" width="252" height="110" rx="14" stroke="#2563EB"/>
    <text x="28" y="70" font-size="13" font-weight="600" class="mentor">阿微</text>
    <text x="28" y="94" font-size="12" class="ink">构建时集成，性能最好；</text>
    <text x="28" y="114" font-size="12" class="ink">版本治理要求最高。</text>
    <text x="28" y="140" font-size="12" font-weight="600" fill="#2563EB">→ 看 Module Federation</text>
    <use href="#m"/><use href="#s"/>
  </g>
</svg>
